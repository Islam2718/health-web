org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler tries to compute a relative path between the
# Gradle/pub caches (on C:) and this project (on E:) to key its cache files.
# On Windows, relativizing between two different drive roots throws
# ("this and base files have different roots"), which crashes
# :webview_flutter_android:compileDebugKotlin. Incremental compilation isn't
# needed for a from-scratch APK build, so it's simplest to just turn it off.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
